name: Release Kodi Addon

on:
  push:
    branches: [main, dev]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract addon info
        id: addon
        run: |
          ADDON_ID=$(python3 -c "import xml.etree.ElementTree as ET; print(ET.parse('addon.xml').getroot().get('id'))")
          VERSION=$(python3 -c "import xml.etree.ElementTree as ET; print(ET.parse('addon.xml').getroot().get('version'))")
          BRANCH="${GITHUB_REF##*/}"
          if [ "$BRANCH" = "dev" ]; then
            TAG="v${VERSION}-dev"
            ZIP_NAME="dist/${ADDON_ID}-${VERSION}-dev.zip"
            IS_PRE="true"
          else
            TAG="v${VERSION}"
            ZIP_NAME="dist/${ADDON_ID}-${VERSION}.zip"
            IS_PRE="false"
          fi
          echo "addon_id=$ADDON_ID" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "zip_name=$ZIP_NAME" >> "$GITHUB_OUTPUT"
          echo "is_pre=$IS_PRE" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Build addon zip
        run: |
          python3 scripts/package.py ${{ steps.addon.outputs.branch == 'dev' && '--dev' || '' }}

      - name: Delete existing release if same tag
        run: |
          gh release delete "${{ steps.addon.outputs.tag }}" --yes --cleanup-tag 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        run: |
          gh release create "${{ steps.addon.outputs.tag }}" \
            "${{ steps.addon.outputs.zip_name }}" \
            --title "${{ steps.addon.outputs.addon_id }} ${{ steps.addon.outputs.version }}${{ steps.addon.outputs.branch == 'dev' && ' (dev)' || '' }}" \
            --notes "Automated release from ${{ steps.addon.outputs.branch }} branch" \
            ${{ steps.addon.outputs.is_pre == 'true' && '--prerelease' || '--latest' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for release to propagate
        run: |
          for i in $(seq 1 10); do
            LATEST=$(curl -s -H "Accept: application/vnd.github.v3+json" \
              https://api.github.com/repos/${{ github.repository }}/releases/latest | \
              python3 -c "import sys,json; print(json.load(sys.stdin).get('tag_name',''))")
            echo "Attempt $i: latest=$LATEST expected=${{ steps.addon.outputs.tag }}"
            [ "$LATEST" = "${{ steps.addon.outputs.tag }}" ] && exit 0
            sleep 3
          done
          echo "::warning::Release not yet propagated after 30s, dispatching anyway"

      - name: Trigger repository update
        if: secrets.REPO_DISPATCH_TOKEN != ''
        run: |
          curl -X POST \
            -H "Authorization: token ${{ secrets.REPO_DISPATCH_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/VSeryi/kodi/dispatches \
            -d '{"event_type":"addon_updated","client_payload":{"addon":"${{ steps.addon.outputs.addon_id }}","version":"${{ steps.addon.outputs.version }}","branch":"${{ steps.addon.outputs.branch }}"}}'
